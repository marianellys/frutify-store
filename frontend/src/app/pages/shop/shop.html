<div class="bg-light py-4">
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <h2 class="fw-bold">Tienda</h2>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-0">
                        <li class="breadcrumb-item"><a href="/">Inicio</a></li>
                        <li class="breadcrumb-item active">Tienda</li>
                    </ol>
                </nav>
            </div>
        </div>
    </div>
</div>

<div class="py-5">
    <div class="container">
        <div class="row">
            <div class="col-lg-3">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body">
                        <div class="input-group">
                            <input class="form-control" type="text" placeholder="Buscar productos" [(ngModel)]="searchQuery" />
                            <button class="btn btn-outline-secondary" type="button"><i class="fa fa-search"></i></button>
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body">
                        <h5 class="fw-bold mb-3">Categorías</h5>
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item d-flex justify-content-between align-items-center">
                                <a class="text-decoration-none text-dark fw-semibold" (click)="filterByCategory('')">Todas</a>
                                <span class="badge bg-secondary rounded-pill">{{ products.length }}</span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between align-items-center" *ngFor="let category of categories">
                                <a class="text-decoration-none text-dark fw-semibold" (click)="filterByCategory(category)">{{ category | titlecase }}</a>
                                <span class="badge bg-secondary rounded-pill">{{ getCategoryCount(category) }}</span>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="col-lg-9">
                <div class="d-flex flex-wrap justify-content-between align-items-center bg-light rounded p-3 mb-4">
                    <div class="d-flex align-items-center gap-3">
                        <select class="form-select form-select-sm w-auto">
                            <option>Ordenar por</option>
                            <option>Más populares</option>
                            <option>Precio: Mayor a Menor</option>
                            <option>Precio: Menor a Mayor</option>
                        </select>
                    </div>
                    <span class="text-muted small">Mostrando 1–9 de 21 resultados</span>
                </div>

                <div class="row g-4">
                    <div class="col-sm-6 col-md-6 col-lg-4" *ngFor="let product of filteredProducts">
                        <div class="card shadow-sm border-0 h-100">
                            <div class="position-relative">
                                <span class="badge bg-danger position-absolute top-0 start-0 m-2" *ngIf="product.rating >= 4.5">Oferta</span>
                                <span class="badge bg-success position-absolute top-0 start-0 m-2" *ngIf="product.rating < 4.5">Nuevo</span>
                                <img [src]="product.image" class="card-img-top" [alt]="product.name">
                            </div>
                            <div class="card-body text-center">
                                <h6 class="card-title fw-semibold mb-1">{{ product.name }}</h6>
                                <p class="fw-bold text-warning mb-2">${{ product.price }}</p>
                                <p class="text-muted small">{{ product.description }}</p>
                                <a [routerLink]="['/shop-detail', product.id]" class="btn btn-primary btn-sm w-100">Ver Detalle</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
