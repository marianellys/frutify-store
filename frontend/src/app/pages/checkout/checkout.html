<div class="bg-light py-4">
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <h2 class="fw-bold">Pagar</h2>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-0">
                        <li class="breadcrumb-item"><a href="/">Inicio</a></li>
                        <li class="breadcrumb-item active">Pagar</li>
                    </ol>
                </nav>
            </div>
        </div>
    </div>
</div>

<div class="py-5">
    <div class="container">
        <div class="row">
            <div class="col-lg-6 mb-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h3 class="fw-bold mb-4">Dirección de Envío</h3>
                        <form>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Nombre *</label>
                                    <input class="form-control" type="text">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Apellido *</label>
                                    <input class="form-control" type="text">
                                </div>
                                <div class="col-12 mb-3">
                                    <label class="form-label">Correo *</label>
                                    <input class="form-control" type="email">
                                </div>
                                <div class="col-12 mb-3">
                                    <label class="form-label">Dirección *</label>
                                    <input class="form-control" type="text" placeholder="Calle, número, colonia">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">País *</label>
                                    <select class="form-select">
                                        <option>Seleccionar...</option>
                                        <option>México</option>
                                        <option>Estados Unidos</option>
                                        <option>España</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Código Postal *</label>
                                    <input class="form-control" type="text">
                                </div>
                                <div class="col-12 mb-3">
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input" id="same-address">
                                        <label class="form-check-label" for="same-address">Usar misma dirección para facturación</label>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-lg-6 mb-4">
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <h3 class="fw-bold mb-3">Método de Pago</h3>
                        <div class="form-check mb-2">
                            <input id="payment-1" name="payment" type="radio" class="form-check-input" checked>
                            <label class="form-check-label" for="payment-1">Tarjeta de Crédito</label>
                        </div>
                        <div class="form-check mb-2">
                            <input id="payment-2" name="payment" type="radio" class="form-check-input">
                            <label class="form-check-label" for="payment-2">PayPal</label>
                        </div>
                        <div class="form-check mb-3">
                            <input id="payment-3" name="payment" type="radio" class="form-check-input">
                            <label class="form-check-label" for="payment-3">Transferencia</label>
                        </div>
                        <form>
                            <div class="mb-3">
                                <label class="form-label">Nombre en la Tarjeta</label>
                                <input class="form-control" type="text">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Número de Tarjeta</label>
                                <input class="form-control" type="text">
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Vencimiento</label>
                                    <input class="form-control" type="text" placeholder="MM/AA">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">CVV</label>
                                    <input class="form-control" type="text">
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <h3 class="fw-bold mb-3">Método de Envío</h3>
                        <div class="form-check mb-2">
                            <input id="ship-1" name="shipping" type="radio" class="form-check-input" checked>
                            <label class="form-check-label" for="ship-1">Estándar (Gratis)</label>
                        </div>
                        <div class="form-check mb-2">
                            <input id="ship-2" name="shipping" type="radio" class="form-check-input">
                            <label class="form-check-label" for="ship-2">Express ($10.00)</label>
                        </div>
                        <div class="form-check">
                            <input id="ship-3" name="shipping" type="radio" class="form-check-input">
                            <label class="form-check-label" for="ship-3">Siguiente Día ($20.00)</label>
                        </div>
                    </div>
                </div>
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h3 class="fw-bold mb-3">Tu Pedido</h3>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Manzanas Frescas x1</span><span>$80.00</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Naranjas Dulces x2</span><span>$120.00</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Vegetales Mixtos x1</span><span>$40.00</span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between mb-1">
                            <span>Subtotal</span><span class="fw-bold">$240.00</span>
                        </div>
                        <div class="d-flex justify-content-between mb-1">
                            <span>Envío</span><span class="text-success">Gratis</span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between mb-3">
                            <h5 class="fw-bold">Total</h5><span class="fw-bold fs-5">$240.00</span>
                        </div>
                        <a class="btn btn-warning text-white fw-bold w-100 btn-lg" href="#">Confirmar Pedido</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
