@if (showButton) {
<button class="btn btn-warning text-white rounded-circle shadow position-fixed d-flex align-items-center justify-content-center border-0 z-3" (click)="scrollToTop()" [style.bottom.px]="bottomOffset" style="right:20px;width:50px;height:50px;font-size:20px">
  <i class="fas fa-arrow-up"></i>
</button>
}
